name: Publish verified ChatDock installer
on:
  push:
    branches:
      - 'upload/v*'
permissions:
  contents: write
concurrency:
  group: chatdock-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify compiled installer
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#upload/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Unexpected release tag'; exit 1; }
          mkdir -p release
          test -f payload/sha256.txt
          compgen -G 'payload/ChatDock-Setup.exe.part*' > /dev/null
          cat payload/ChatDock-Setup.exe.part* > release/ChatDock-Setup.exe
          test "$(stat -c '%s' release/ChatDock-Setup.exe)" -gt 1000000
          expected="$(tr -d '[:space:]' < payload/sha256.txt)"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid checksum'; exit 1; }
          echo "$expected  release/ChatDock-Setup.exe" | sha256sum -c -
      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#upload/}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $tag exists already"
            exit 0
          fi
          gh release create "$tag" release/ChatDock-Setup.exe \
            --repo "${GITHUB_REPOSITORY}" --target main \
            --title "ChatDock ${tag#v}" \
            --notes "Windows installer for ChatDock. For versions 0.1.9 and newer, future releases are downloaded and installed from inside the app." \
            --latest
      - name: Delete temporary upload branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
